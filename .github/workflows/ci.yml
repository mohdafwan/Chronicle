# Windows is where Chronicle runs; Linux is here to keep the non-Windows stubs
# compiling, since they are the only thing a future macOS port starts from.
#
# `cargo fmt --check` is deliberately not a gate: the tree is not rustfmt-clean
# and the aligned catalogue in policy.rs is hand-set on purpose. Turning the
# gate on means running `cargo fmt --all` once first, which is a change worth
# making on its own rather than smuggling into a CI file.

name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Tauri needs a webview to link against; the recorder needs nothing.
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
