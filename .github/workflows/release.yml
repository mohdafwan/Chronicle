# Publishes the two binaries Chronicle actually installs, plus the checksum
# file the built-in updater verifies them against.
#
# Windows only, deliberately. The observer is Win32 — `GetForegroundWindow`,
# `IShellWindows`, the PEB read that gives a terminal its directory — and the
# other platforms compile only against stubs that observe nothing. Publishing a
# macOS build of a workspace recorder that cannot see a workspace would be
# shipping a promise the binary does not keep.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A tag that disagrees with Cargo.toml ships a binary that reports the
      # wrong version, and the updater compares versions — so it would either
      # offer an upgrade to what is already installed, or never offer one again.
      - name: Tag must match the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $crate = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          Write-Output "Cargo.toml says $crate; the tag says $tag"
          if ($crate -eq $tag) { exit 0 }

          # Almost always the same mistake: the tag went on the commit before
          # the version bump, so it is one commit short. Say what to run rather
          # than leaving a red cross on a page that shows no release.
          Write-Output ""
          Write-Output "Nothing was published. The tag is on a commit where Cargo.toml still"
          Write-Output "says $crate, so the binaries would report $crate under a v$tag tag —"
          Write-Output "and the updater compares versions, so that build would offer itself"
          Write-Output "as an upgrade forever."
          Write-Output ""
          Write-Output "If the bump is the next commit along, move the tag onto it:"
          Write-Output "    git tag -f ${{ github.ref_name }} <commit that bumps Cargo.toml>"
          Write-Output "    git push -f origin ${{ github.ref_name }}"
          Write-Output ""
          Write-Output "Next time, bump and tag together:"
          Write-Output "    # edit Cargo.toml, then"
          Write-Output "    cargo check                     # so Cargo.lock follows"
          Write-Output "    git commit -am 'release v$tag'"
          Write-Output "    git tag v$tag && git push && git push --tags"
          throw "tag v$tag does not match the version in Cargo.toml ($crate)"

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      # Named for what they are, because the updater looks them up by name and
      # `chronicle.exe` alone says nothing about which platform it is for.
      - name: Assemble
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\chronicled.exe dist\chronicled-windows-x86_64.exe
          Copy-Item target\release\chronicle.exe  dist\chronicle-windows-x86_64.exe

          # `sha256  name`, the format sha256sum writes and the updater reads.
          # ASCII on purpose: a BOM would ride along on the first hash.
          $lines = Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $lines | Set-Content dist\SHA256SUMS -Encoding ascii
          Get-Content dist\SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/chronicled-windows-x86_64.exe
            dist/chronicle-windows-x86_64.exe
            dist/SHA256SUMS
          body: |
            ## Chronicle ${{ github.ref_name }}

            | file | what it is |
            | --- | --- |
            | `chronicled-windows-x86_64.exe` | the recorder — the part that runs in the background |
            | `chronicle-windows-x86_64.exe` | the window |
            | `SHA256SUMS` | checksums, which the built-in updater verifies before installing |

            **Already have Chronicle?** `chronicled update --install` fetches this
            release, checks it against `SHA256SUMS`, replaces the binaries and
            restarts the recorder without losing the session in progress.

            **First install?** Save both binaries somewhere outside your build
            directory — `%LOCALAPPDATA%\Programs\Chronicle` is the usual place —
            then run `chronicled autostart on` so the recorder starts with Windows.

            Chronicle records only on this machine and uploads nothing. The one
            time it uses the network is this update check, and that is off until
            you turn it on with `chronicled update --auto check`.
